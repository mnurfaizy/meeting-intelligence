# Render Blueprint: one Docker web service (ffmpeg included). Data lives in Turso.
# The app's code is in source/; Render builds it from there.
services:
  - type: web
    name: meeting-intelligence
    runtime: docker
    dockerContext: ./source
    dockerfilePath: ./source/Dockerfile
    plan: free
    region: oregon # same region as the Turso database (AWS us-west-2) for fast queries
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD # password to open the app
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # The free plan's disk is wiped on every restart/sleep/deploy, so recordings are kept in a folder
      # on your own computer instead (the browser saves them there; Chrome or Edge on desktop).
      - key: AUDIO_STORAGE
        value: device
    # To keep recordings on the server instead, switch to a paid plan, add a disk and remove AUDIO_STORAGE:
    # plan: starter
    # disk:
    #   name: recordings
    #   mountPath: /var/data
    #   sizeGB: 10
    # ...and set AUDIO_DIR=/var/data/recordings
